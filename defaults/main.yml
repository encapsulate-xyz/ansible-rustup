---

rustup_user: "{{ ansible_env.USER | default('root') }}"
rustup_home_suffix: ".rustup"
rustup_cargo_home_suffix: ".cargo"
rustup_default_version: stable
rustup_cargo_crates:
  - fd-find
  - ripgrep

# rustup-init is downloaded by version from static.rust-lang.org and checked against the
# SHA-256 that the Rust project publishes next to it:
#   https://static.rust-lang.org/rustup/archive/<version>/<target>/rustup-init.sha256
# To bump: change the version, then replace every hash from those files.
rustup_version: "1.29.1"
rustup_init_checksums:
  x86_64-unknown-linux-gnu: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
  aarch64-unknown-linux-gnu: 15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433
  x86_64-apple-darwin: 259e2b84274434085163fe8d556510571772cda2aa6d87ca6aa664f57bc644e3
  aarch64-apple-darwin: ec1b9233e7f72990ecd8e62063fa7f6c3dfc2bec8e97f88bff165f9100ac696a
